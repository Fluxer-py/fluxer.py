 version: 2

 build:
   os: ubuntu-24.04
   tools:
     python: "3.12"
   jobs:
     install:
       - pip install uv
       - uv sync --frozen --group dev
     build:
       html:
         - cd docs && uv run zensical build
     post_build:
       # Copy the built site into the directory Read the Docs publishes.
       - mkdir -p $READTHEDOCS_OUTPUT/html/
       - cp --recursive docs/site/* $READTHEDOCS_OUTPUT/html/