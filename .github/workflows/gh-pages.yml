name: Documentation

on:
  push:
    branches:
      - docs

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen --group dev

      - run: cd docs && uv run zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

      - uses: actions/deploy-pages@v5
        id: deployment